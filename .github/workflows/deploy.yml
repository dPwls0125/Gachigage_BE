name: Gachigage Backend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Compute Tag
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=prod" >> $GITHUB_OUTPUT
            echo "service=backend-prod" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "service=backend-dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{env.OWNER_LC}}/${{env.OWNER_LC}}-backend:${{steps.meta.outputs.tag}}
            ghcr.io/${{env.OWNER_LC}}/${{env.OWNER_LC}}-backend:${{github.sha}}

      - name: Deploy on Server (pull and up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          password: ${{secrets.SERVER_PASSWORD}}
          script: |
            set -e
            cd /opt/gachigage

            IMAGE=ghcr.io/${{env.OWNER_LC}}/${{env.OWNER_LC}}-backend
            SHA_TAG=${{github.sha}}
            ROLLING_TAG=${{steps.meta.outputs.tag}}

            docker pull ${IMAGE}:${SHA_TAG}
            docker tag ${IMAGE}:${SHA_TAG} ${IMAGE}:${ROLLING_TAG}

            docker compose up -d --no-deps --force-recreate ${{steps.meta.outputs.service}}
            docker image prune -af --filter "until=168h"
