events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
	    default upgrade;
	    '' close;
    }
    log_format with_port '$remote_addr - $host:$server_port [$time_local] '
                     '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log with_port;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 10M;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend_prod {
        server backend-prod:8080;
    }

    upstream backend_dev {
	    server backend-dev:8080;
    }

    server {
        listen 80;
        server_name gachigage.com www.gachigage.com;

	    location /.well-known/acme-challenge/ {
	        root /var/www/certbot;
	    }

        location / {
	        return 301 https://$host$request_uri;
        }
    }

    server {
        listen 80;
        server_name dev.gachigage.com;

	    location /.well-known/acme-challenge/ {
	        root /var/www/certbot;
	    }

        location / {
	        return 301 https://$host$request_uri;
        }
    }

    server {
	    listen 80 default_server;
	    listen 443 ssl default_server;
	    server_name _;

	    ssl_reject_handshake on;

	    return 444;
    }

    server {
	    listen 443 ssl;
	    server_name gachigage.com www.gachigage.com;

	    ssl_certificate /etc/letsencrypt/live/gachigage.com/fullchain.pem;
	    ssl_certificate_key /etc/letsencrypt/live/gachigage.com/privkey.pem;

	    include /etc/letsencrypt/options-ssl-nginx.conf;
	    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


        location /api/stomp {
	        proxy_pass	       http://backend_prod;
	        proxy_http_version 1.1;
	        proxy_set_header Upgrade $http_upgrade;
	        proxy_set_header Connection $connection_upgrade;

	        proxy_set_header   Host $host;
	        proxy_set_header   X-Real-IP $remote_addr;
	        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header   X-Forwarded-Proto https;
	        proxy_set_header   X-Forwarded-Port 443;

	        proxy_read_timeout 86400s;
	        proxy_send_timeout 86400s;
	    }

	    location /stomp {
	        proxy_pass		http://backend_prod/stomp;
	        proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/naver {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/auth {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

	    location /api {
	        proxy_pass         http://backend_prod;
	        proxy_set_header   Host $host;
	        proxy_set_header   X-Real-IP $remote_addr;
	        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header   X-Forwarded-Proto $scheme;
	    }

	    location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header   X-Forwarded-Proto $scheme;
        }
   }

   server {
        listen 443 ssl;
        server_name dev.gachigage.com;

        ssl_certificate /etc/letsencrypt/live/dev.gachigage.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.gachigage.com/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /api/stomp {
            proxy_pass          http://backend_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Port 443;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /stomp {
            proxy_pass      http://backend_dev/stomp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api {
            proxy_pass         http://backend_dev;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
